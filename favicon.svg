<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="South Indian filter coffee">
  <!-- soft gray square backdrop -->
  <rect width="64" height="64" rx="10" fill="#e7e5e0"/>

  <g transform="translate(5.76 5.76) scale(0.82)">
    <!-- davara: wide short cylinder, flat bottom -->
    <path d="M8 41 L8 51.5 Q8 55.5 13 55.5 L51 55.5 Q56 55.5 56 51.5 L56 41 Q44 43 32 43 Q20 43 8 41 Z" fill="#c1922f"/>
    <path d="M8 47 Q8 55.5 13 55.5 L51 55.5 Q56 55.5 56 47 Q56 52 50 52 L14 52 Q8 52 8 47 Z" fill="#a3781f" opacity="0.45"/>

    <!-- tumbler: V-shaped cup, flaring wider toward the top -->
    <path d="M19.5 21 L23 41 L41 41 L44.5 21 Z" fill="#c1922f"/>
    <path d="M19.5 21 L25 21 L28.5 41 L23 41 Z" fill="#d9ad50"/>
    <path d="M44.5 21 L41.5 21 L38.5 41 L41 41 Z" fill="#a67a24"/>

    <!-- davara flared rim (drawn over the tumbler base so the cup sits inside) -->
    <path d="M3 40 Q3 36.8 11 37.5 Q22 38.4 32 38.4 Q42 38.4 53 37.5 Q61 36.8 61 40 Q54 41.9 44 41.3 Q32 42 20 41.3 Q10 41.9 3 40 Z" fill="#c1922f"/>
    <path d="M3 40 Q3 36.8 11 37.5 Q22 38.4 32 38.4 Q42 38.4 53 37.5 Q61 36.8 61 40 Q53 40.9 43 40.4 Q32 41 21 40.4 Q11 40.9 3 40 Z" fill="#e4bd61"/>

    <!-- tumbler flared rim -->
    <path d="M15.5 20 Q15.5 17.3 20.5 18 Q32 18.9 43.5 18 Q48.5 17.3 48.5 20 Q42 21.7 32 21.7 Q22 21.7 15.5 20 Z" fill="#c1922f"/>
    <path d="M15.5 20 Q15.5 17.3 20.5 18 Q32 18.9 43.5 18 Q48.5 17.3 48.5 20 Q41 20.7 32 21.1 Q23 20.7 15.5 20 Z" fill="#e4bd61"/>

    <!-- froth: a flat caramel coffee crema with foam bubbles -->
    <path d="M18 18 Q18 15.3 32 15.1 Q46 15.3 46 18 Q46 20.8 32 20.8 Q18 20.8 18 18 Z" fill="#a9793f"/>
    <circle cx="26" cy="17.3" r="1.6" fill="#c9a76e"/>
    <circle cx="35.4" cy="16.9" r="1.9" fill="#d3b47e"/>
    <circle cx="30.8" cy="18.7" r="1.3" fill="#bd9459"/>
    <circle cx="39.5" cy="17.9" r="1.2" fill="#c9a76e"/>
    <circle cx="22.5" cy="18.2" r="1.1" fill="#bd9459"/>
    <circle cx="30" cy="16.4" r="1" fill="#dcc08c"/>
    <circle cx="37" cy="19" r="0.9" fill="#b48a4f"/>
    <circle cx="24.3" cy="16.7" r="0.9" fill="#dcc08c"/>
    <circle cx="42.5" cy="19.1" r="0.8" fill="#bd9459"/>
    <circle cx="20" cy="18.8" r="0.7" fill="#bd9459"/>
  </g>
</svg>
